<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Sizer — Position Calculator</title>
<meta name="description" content="Forex position sizing calculator — enter your trade details, get your lot size instantly.">
<meta name="theme-color" content="#0a0c0f" id="themeMetaColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FX Sizer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181c22;
    --border: #242830;
    --border-light: #2e3540;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --accent-dim2: rgba(0,229,160,0.06);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.12);
    --yellow: #ffd166;
    --yellow-dim: rgba(255,209,102,0.12);
    --text: #e8edf5;
    --text-muted: #6b7585;
    --text-mid: #9aa3b0;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 10px;
    --radius-sm: 6px;
    --header-bg: rgba(10,12,15,0.92);
  }

  :root.light {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #e8ebf0;
    --border: #d4d9e2;
    --border-light: #bcc3cf;
    --accent: #00a873;
    --accent-dim: rgba(0,168,115,0.10);
    --accent-dim2: rgba(0,168,115,0.05);
    --red: #d93256;
    --red-dim: rgba(217,50,86,0.10);
    --yellow: #b07d00;
    --yellow-dim: rgba(176,125,0,0.10);
    --text: #0f1317;
    --text-muted: #8a95a3;
    --text-mid: #4a5568;
    --header-bg: rgba(240,242,245,0.92);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body, header, .settings-panel, .account-row, .input-card,
  .results-card, .error-banner, .gear-btn, .theme-toggle,
  .settings-row input[type="number"] {
    transition: background 0.25s ease, border-color 0.25s ease, color 0.2s ease;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .logo span { color: var(--text-muted); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .gear-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-mid);
    border-radius: var(--radius-sm);
    width: 36px; height: 36px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
  }
  .gear-btn:hover { border-color: var(--accent); color: var(--accent); }

  .theme-toggle {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 56px; height: 28px;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    padding: 3px;
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .toggle-track {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5px;
    font-size: 11px;
    pointer-events: none;
  }
  .toggle-thumb {
    position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    left: 3px;
    transition: left 0.22s cubic-bezier(0.4,0,0.2,1), background 0.25s;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .light .toggle-thumb { left: 31px; }

  main { padding: 16px; max-width: 520px; margin: 0 auto; }

  .settings-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    display: none;
    animation: slideDown 0.18s ease;
  }
  .settings-panel.open { display: block; }
  @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .settings-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .settings-row label {
    font-size: 13px;
    color: var(--text-mid);
    flex: 1;
    min-width: 120px;
  }
  .settings-row input[type="number"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    width: 80px;
    text-align: right;
    outline: none;
  }
  .settings-row input[type="number"]:focus { border-color: var(--accent); }
  .pct-label { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }

  .account-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .account-row label {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .account-row .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    gap: 4px;
  }
  .account-row .input-wrap:focus-within { border-color: var(--accent); }
  .currency-sym {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
  }
  .account-row input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    padding: 9px 4px;
    width: 100%;
    outline: none;
  }
  .risk-badge {
    background: var(--accent-dim);
    border: 1px solid rgba(0,229,160,0.25);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    white-space: nowrap;
    cursor: pointer;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .input-card .field-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .input-card .field-row:last-of-type { margin-bottom: 0; }
  .input-card .field-row label {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 80px;
  }
  .input-card .field-row .field-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    gap: 4px;
  }
  .input-card .field-row .field-wrap:focus-within { border-color: var(--accent); }
  .input-card .field-row input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 9px 4px;
    width: 100%;
    outline: none;
  }

  .autocomplete-wrap { position: relative; flex: 1; }
  .autocomplete-wrap .field-wrap { width: 100%; }
  .autocomplete-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    max-height: 200px;
    overflow-y: auto;
    z-index: 200;
    display: none;
  }
  .autocomplete-dropdown.open { display: block; }
  .autocomplete-item {
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-mid);
    cursor: pointer;
    transition: background 0.1s;
  }
  .autocomplete-item:hover,
  .autocomplete-item.active {
    background: var(--accent-dim);
    color: var(--accent);
  }
  .autocomplete-item .match-highlight {
    color: var(--accent);
    font-weight: 700;
  }

  .btn-calculate {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 12px 16px;
    cursor: pointer;
    margin-top: 14px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-calculate:hover { opacity: 0.88; }
  .btn-calculate:active { transform: scale(0.98); }

  .error-banner {
    background: var(--red-dim);
    border: 1px solid rgba(255,77,109,0.3);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 14px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .error-banner.show { display: flex; }

  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .results-card.show { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  .results-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .results-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .lot-hero {
    padding: 18px 14px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }
  .lot-number {
    font-family: var(--mono);
    font-size: 38px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .lot-unit {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
    padding-bottom: 5px;
  }
  .lot-meta {
    margin-left: auto;
    text-align: right;
  }
  .lot-meta .risk-amt {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--red);
  }
  .lot-meta .risk-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .pip-info-row {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .pip-info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .pip-info-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .pip-info-value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-mid);
  }
  .pip-match { color: var(--accent); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

  .bottom-pad { height: 40px; }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>

<header>
  <div class="logo">FX<span>/</span>SIZER</div>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode" aria-label="Toggle theme">
      <div class="toggle-track">
        <span>🌙</span>
        <span>☀️</span>
      </div>
      <div class="toggle-thumb" id="toggleThumb">🌙</div>
    </button>
    <button class="gear-btn" id="gearBtn" title="Settings">⚙</button>
  </div>
</header>

<main>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-title">Risk Settings</div>
    <div class="settings-row">
      <label>Risk per trade</label>
      <input type="number" id="riskPct" value="1" min="0.1" max="100" step="0.1">
      <span class="pct-label">%</span>
    </div>
  </div>

  <div class="account-row">
    <label>Account Balance</label>
    <div class="input-wrap">
      <span class="currency-sym">$</span>
      <input type="number" id="accountBalance" placeholder="10000" min="0" step="100">
    </div>
    <div class="risk-badge" id="riskBadge">1% risk</div>
  </div>

  <div class="section-label">Trade Details</div>
  <div class="input-card">
    <div class="field-row">
      <label for="instrumentInput">Instrument</label>
      <div class="autocomplete-wrap">
        <div class="field-wrap">
          <input type="text" id="instrumentInput" placeholder="Type to search..." autocomplete="off" spellcheck="false">
        </div>
        <div class="autocomplete-dropdown" id="instrumentDropdown"></div>
      </div>
    </div>
    <div class="field-row">
      <label for="entryPrice">Entry</label>
      <div class="field-wrap">
        <input type="number" id="entryPrice" step="any" placeholder="e.g. 1.08500">
      </div>
    </div>
    <div class="field-row">
      <label for="slPrice">Stop Loss</label>
      <div class="field-wrap">
        <input type="number" id="slPrice" step="any" placeholder="e.g. 1.08200">
      </div>
    </div>
    <button class="btn-calculate" id="calcBtn">CALCULATE</button>
  </div>

  <div class="error-banner" id="errorBanner">
    <span>⚠</span>
    <span id="errorMsg"></span>
  </div>

  <div class="results-card" id="resultsCard">
    <div class="results-header">
      <span class="results-title">Position Sizing</span>
    </div>
    <div class="lot-hero">
      <div class="lot-number" id="lotSize">—</div>
      <div class="lot-unit">lots</div>
      <div class="lot-meta">
        <div class="risk-amt" id="riskAmount">—</div>
        <div class="risk-label">max risk (USD)</div>
      </div>
    </div>
    <div class="pip-info-row">
      <div class="pip-info-item">
        <span class="pip-info-label">SL Distance</span>
        <span class="pip-info-value" id="pipCalc">—</span>
      </div>
      <div class="pip-info-item">
        <span class="pip-info-label">Pip Value / lot</span>
        <span class="pip-info-value" id="pipValue">—</span>
      </div>
      <div class="pip-info-item">
        <span class="pip-info-label">Instrument Type</span>
        <span class="pip-info-value" id="instrType">—</span>
      </div>
    </div>
  </div>

  <div class="bottom-pad"></div>
</main>

<script>
const INSTRUMENTS = {
  XAUUSD: { type: 'metal',   pipSize: 0.01,   pipValuePerLot: 1.00   },
  XAGUSD: { type: 'metal',   pipSize: 0.001,  pipValuePerLot: 5.00   },
  XPTUSD: { type: 'metal',   pipSize: 0.01,   pipValuePerLot: 1.00   },

  EURUSD: { type: 'forex_usd_quote', pipSize: 0.0001, pipValuePerLot: 10 },
  GBPUSD: { type: 'forex_usd_quote', pipSize: 0.0001, pipValuePerLot: 10 },
  AUDUSD: { type: 'forex_usd_quote', pipSize: 0.0001, pipValuePerLot: 10 },
  NZDUSD: { type: 'forex_usd_quote', pipSize: 0.0001, pipValuePerLot: 10 },

  USDJPY: { type: 'forex_jpy', pipSize: 0.01, pipValuePerLot: null },
  EURJPY: { type: 'forex_jpy', pipSize: 0.01, pipValuePerLot: null },
  GBPJPY: { type: 'forex_jpy', pipSize: 0.01, pipValuePerLot: null },
  AUDJPY: { type: 'forex_jpy', pipSize: 0.01, pipValuePerLot: null },
  CADJPY: { type: 'forex_jpy', pipSize: 0.01, pipValuePerLot: null },
  CHFJPY: { type: 'forex_jpy', pipSize: 0.01, pipValuePerLot: null },
  NZDJPY: { type: 'forex_jpy', pipSize: 0.01, pipValuePerLot: null },

  USDCAD: { type: 'forex_cad_quote', pipSize: 0.0001, pipValuePerLot: null },
  USDCHF: { type: 'forex_chf_quote', pipSize: 0.0001, pipValuePerLot: null },

  EURGBP: { type: 'forex_cross', pipSize: 0.0001, pipValuePerLot: 13 },
  EURAUD: { type: 'forex_cross', pipSize: 0.0001, pipValuePerLot: 6.5 },
  GBPAUD: { type: 'forex_cross', pipSize: 0.0001, pipValuePerLot: 6.5 },
  GBPCAD: { type: 'forex_cross', pipSize: 0.0001, pipValuePerLot: 7.5 },
  AUDCAD: { type: 'forex_cross', pipSize: 0.0001, pipValuePerLot: 7.3 },
  AUDCHF: { type: 'forex_cross', pipSize: 0.0001, pipValuePerLot: 7.0 },

  US30:   { type: 'index', pipSize: 1, pipValuePerLot: 1 },
  US500:  { type: 'index', pipSize: 0.1, pipValuePerLot: 1 },
  NAS100: { type: 'index', pipSize: 0.1, pipValuePerLot: 1 },
  GER40:  { type: 'index', pipSize: 1, pipValuePerLot: 1 },

  BTCUSD: { type: 'crypto', pipSize: 1, pipValuePerLot: 1 },
  ETHUSD: { type: 'crypto', pipSize: 0.01, pipValuePerLot: 1 },

  USOIL:  { type: 'commodity', pipSize: 0.01, pipValuePerLot: 10 },
  UKOIL:  { type: 'commodity', pipSize: 0.01, pipValuePerLot: 10 },
};

function getInstrumentInfo(symbol) {
  const upper = symbol.toUpperCase();
  if (INSTRUMENTS[upper]) return { ...INSTRUMENTS[upper], symbol: upper, known: true };
  if (upper.endsWith('USD')) return { type: 'forex_usd_quote', pipSize: 0.0001, pipValuePerLot: 10, symbol: upper, known: false };
  if (upper.endsWith('JPY')) return { type: 'forex_jpy',       pipSize: 0.01,   pipValuePerLot: 7,  symbol: upper, known: false };
  return { type: 'forex_cross', pipSize: 0.0001, pipValuePerLot: 10, symbol: upper, known: false };
}

function getPipValuePerLot(info, entryPrice) {
  if (info.pipValuePerLot !== null && info.pipValuePerLot !== undefined) return info.pipValuePerLot;
  if (info.type === 'forex_jpy') {
    return (info.pipSize * 100000) / entryPrice;
  }
  if (info.type === 'forex_cad_quote' || info.type === 'forex_chf_quote') {
    return (info.pipSize * 100000) / entryPrice;
  }
  return 10;
}

// ── UI ──────────────────────────────────────────────────────────────
const gearBtn = document.getElementById('gearBtn');
const themeToggle = document.getElementById('themeToggle');
const toggleThumb = document.getElementById('toggleThumb');
const settingsPanel = document.getElementById('settingsPanel');
const riskPctInput = document.getElementById('riskPct');
const accountInput = document.getElementById('accountBalance');
const riskBadge = document.getElementById('riskBadge');
const instrumentInput = document.getElementById('instrumentInput');
const instrumentDropdown = document.getElementById('instrumentDropdown');
const entryPriceInput = document.getElementById('entryPrice');
const slPriceInput = document.getElementById('slPrice');
const calcBtn = document.getElementById('calcBtn');
const errorBanner = document.getElementById('errorBanner');
const errorMsg = document.getElementById('errorMsg');
const resultsCard = document.getElementById('resultsCard');

const ALL_SYMBOLS = Object.keys(INSTRUMENTS).sort();
let selectedInstrument = '';
let activeIndex = -1;

function renderDropdown(filter) {
  const term = filter.toUpperCase().trim();
  const matches = term ? ALL_SYMBOLS.filter(s => s.includes(term)) : ALL_SYMBOLS;
  activeIndex = -1;
  instrumentDropdown.innerHTML = '';

  if (matches.length === 0) {
    instrumentDropdown.classList.remove('open');
    return;
  }

  matches.forEach(sym => {
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.dataset.symbol = sym;
    if (term) {
      const idx = sym.indexOf(term);
      div.innerHTML = sym.slice(0, idx) + '<span class="match-highlight">' + sym.slice(idx, idx + term.length) + '</span>' + sym.slice(idx + term.length);
    } else {
      div.textContent = sym;
    }
    instrumentDropdown.appendChild(div);
  });

  instrumentDropdown.classList.add('open');
}

function selectSymbol(sym) {
  selectedInstrument = sym;
  instrumentInput.value = sym;
  instrumentDropdown.classList.remove('open');
  entryPriceInput.focus();
}

instrumentInput.addEventListener('input', () => {
  selectedInstrument = '';
  renderDropdown(instrumentInput.value);
});

instrumentInput.addEventListener('focus', () => {
  renderDropdown(instrumentInput.value);
});

instrumentInput.addEventListener('keydown', (e) => {
  const items = instrumentDropdown.querySelectorAll('.autocomplete-item');
  if (!instrumentDropdown.classList.contains('open') || items.length === 0) {
    if (e.key === 'Enter') calcBtn.click();
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    items[activeIndex].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    items[activeIndex].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIndex >= 0 && activeIndex < items.length) {
      selectSymbol(items[activeIndex].dataset.symbol);
    }
  } else if (e.key === 'Escape') {
    instrumentDropdown.classList.remove('open');
  }
});

instrumentDropdown.addEventListener('mousedown', (e) => {
  const item = e.target.closest('.autocomplete-item');
  if (item) selectSymbol(item.dataset.symbol);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.autocomplete-wrap')) {
    instrumentDropdown.classList.remove('open');
  }
});

gearBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

themeToggle.addEventListener('click', () => {
  const isLight = document.documentElement.classList.toggle('light');
  toggleThumb.textContent = isLight ? '☀️' : '🌙';
  document.getElementById('themeMetaColor').setAttribute('content', isLight ? '#f0f2f5' : '#0a0c0f');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .catch(err => console.log('SW registration failed:', err));
  });
}

riskPctInput.addEventListener('input', () => {
  riskBadge.textContent = `${riskPctInput.value}% risk`;
});

function showError(msg) {
  errorBanner.classList.add('show');
  errorMsg.textContent = msg;
  resultsCard.classList.remove('show');
}

function hideError() {
  errorBanner.classList.remove('show');
}

function fmt(n, decimals = 2) {
  return n.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function instrTypeLabel(t) {
  const map = {
    metal: 'Metal (XAU/XAG)',
    forex_usd_quote: 'Forex (USD quote)',
    forex_jpy: 'Forex (JPY pair)',
    forex_cad_quote: 'Forex (CAD quote)',
    forex_chf_quote: 'Forex (CHF quote)',
    forex_cross: 'Forex (Cross)',
    index: 'Index / CFD',
    crypto: 'Crypto',
    commodity: 'Commodity',
  };
  return map[t] || t;
}

calcBtn.addEventListener('click', () => {
  hideError();

  const symbol = selectedInstrument || instrumentInput.value.toUpperCase().trim();
  const entry = parseFloat(entryPriceInput.value);
  const sl = parseFloat(slPriceInput.value);
  const balance = parseFloat(accountInput.value);
  const riskPct = parseFloat(riskPctInput.value);

  if (!symbol) { showError('Select an instrument.'); return; }
  if (isNaN(entry)) { showError('Enter an entry price.'); return; }
  if (isNaN(sl)) { showError('Enter a stop loss price.'); return; }
  if (entry === sl) { showError('Entry and stop loss cannot be equal.'); return; }
  if (!balance || balance <= 0) { showError('Enter a valid account balance.'); return; }
  if (!riskPct || riskPct <= 0) { showError('Risk % must be greater than 0.'); return; }

  const info = getInstrumentInfo(symbol);
  const pipSize = info.pipSize;
  const pipValuePerLot = getPipValuePerLot(info, entry);
  const slPips = Math.round(Math.abs(entry - sl) / pipSize);

  if (slPips === 0) { showError('Stop loss is too close to entry for this instrument.'); return; }

  const riskAmount = (riskPct / 100) * balance;
  const lotSize = riskAmount / (slPips * pipValuePerLot);

  document.getElementById('lotSize').textContent = fmt(lotSize, 2);
  document.getElementById('riskAmount').textContent = '$' + fmt(riskAmount, 2);
  document.getElementById('pipCalc').textContent = slPips + ' pips';
  document.getElementById('pipValue').textContent = '$' + fmt(pipValuePerLot, 2) + '/lot';
  document.getElementById('instrType').textContent = instrTypeLabel(info.type);

  resultsCard.classList.add('show');

  setTimeout(() => {
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
});
</script>
</body>
</html>
